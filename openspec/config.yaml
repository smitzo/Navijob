schema: spec-driven

context: |
  NaviJob is a recruitment and job application platform. First release: reusable
  candidate profiles, resume versions, project evidence, curated jobs, native
  applications, recruiter workflows, and moderation. AI agents and external-site
  application automation are deferred add-ons, not release dependencies.
  Existing stack: Next.js/React/TypeScript/Tailwind frontend, Django/DRF backend,
  Postgres/Supabase. Reuse the existing foundation; current demo behavior is not
  production validation. Follow CONTRIBUTING.md and read PRODUCT_PLAN.md,
  designs/DESIGN_BRIEF.md, and openspec/BOARD.md before implementing.
  The user authorized implementation and 50-60 meaningful local commits; follow
  openspec/COMMIT_PLAN.md for 55 planned boundaries. Do not push or deploy. The user selected round 02
  B / Open Road for refinement; preserve its composition and typography while
  implementing the selected B1 / Sage & Forest palette. Licensed font files and
  detailed responsive screens must be verified during implementation.
  Image concepts and colour variants are prototypes, not shipped UI.
  Store all design image files in project-root assets/ and maintain the local
  assets/index.html gallery. Keep design notes, prompts and manifests in designs/.
  Visual quality is a first-class requirement. Use real recruitment references,
  readable typography and purposeful job/application layouts. Avoid generic
  gradient-heavy AI/SaaS styling and unsubstantiated counters or hiring claims.
  Keep candidate facts, permissions, verification scopes, and application states
  explicit. Product changes require focused validation and evidence in the board.
  Preserve existing uncommitted work and stage only task-related changes.
  Local commits are authorized; pushing and deployment are not. OpenSpec artifact completion does not mean product delivery.

rules:
  proposal:
    - State milestone dependencies and explicit non-goals.
    - Distinguish existing behavior from proposed product behavior.
  specs:
    - Use SHALL requirements and WHEN/THEN scenarios.
    - Include meaningful permissions, failure, empty and recovery scenarios.
    - Treat demo fixtures and prototype images as illustrative only.
  design:
    - Explain user flows, visual review criteria, implementation boundaries and risks.
    - Record unresolved visual choice instead of selecting a concept for the user.
  tasks:
    - Use numbered checkboxes grouped into small reviewable work units.
    - Include focused validation and explicit acceptance evidence.
    - Leave implementation tasks unchecked until their behavior is actually verified.
